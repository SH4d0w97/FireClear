name: release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Semantic version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-workflow
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: "Calculate next version"
        id: versions
        run: |
          python3 scripts/bump-version.py --calculate --bump "${{ github.event.inputs.bump_type }}"

      - name: "Preflight check - verify tag and release do not exist"
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.versions.outputs.new_tag }}
        run: |
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/${NEW_TAG}" >/dev/null; then
            echo "Error: Tag ${NEW_TAG} already exists. Aborting."
            exit 1
          fi
          if gh release view "${NEW_TAG}" >/dev/null 2>&1; then
            echo "Error: Release ${NEW_TAG} already exists on GitHub. Aborting."
            exit 1
          fi

      - name: "Apply version and changelog updates"
        run: |
          python3 scripts/bump-version.py --apply --bump "${{ github.event.inputs.bump_type }}"

      - name: "Commit and push release version"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NEW_VERSION: ${{ steps.versions.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes staged for release."
            exit 1
          fi
          git commit -m "chore(release): v${NEW_VERSION}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - name: "Create and push release tag"
        env:
          NEW_TAG: ${{ steps.versions.outputs.new_tag }}
        run: |
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "${NEW_TAG}"

      - name: "Static security audit"
        run: |
          bash scripts/audit.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: "Decode keystore (only if secret is set)"
        env:
          KS_B64: ${{ secrets.FIRECLEAR_KEYSTORE_B64 }}
        run: |
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "${KS_B64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "FIRECLEAR_KEYSTORE=${RUNNER_TEMP}/release.jks" >> "${GITHUB_ENV}"
          fi

      - name: "Build APK"
        id: build
        env:
          FIRECLEAR_KS_PASS: ${{ secrets.FIRECLEAR_KS_PASS }}
          FIRECLEAR_KEY_ALIAS: ${{ secrets.FIRECLEAR_KEY_ALIAS }}
          FIRECLEAR_KEY_PASS: ${{ secrets.FIRECLEAR_KEY_PASS }}
        run: |
          KEY_PASS="${FIRECLEAR_KEY_PASS:-$FIRECLEAR_KS_PASS}"
          if [ -n "${FIRECLEAR_KEYSTORE:-}" ] \
            && [ -n "${FIRECLEAR_KS_PASS:-}" ] \
            && [ -n "${FIRECLEAR_KEY_ALIAS:-}" ] \
            && [ -n "${KEY_PASS:-}" ]; then
            export FIRECLEAR_KEY_PASS="${KEY_PASS}"
            gradle --no-daemon assembleRelease
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "${GITHUB_OUTPUT}"
            echo "signed=true" >> "${GITHUB_OUTPUT}"
          else
            gradle --no-daemon assembleDebug
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "${GITHUB_OUTPUT}"
            echo "signed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: "Verify built APK"
        run: |
          bash scripts/verify-apk.sh "${{ steps.build.outputs.apk_path }}"

      - name: "Prepare release assets"
        env:
          NEW_VERSION: ${{ steps.versions.outputs.new_version }}
          APK_PATH: ${{ steps.build.outputs.apk_path }}
        run: |
          cp "${APK_PATH}" "FireClear-v${NEW_VERSION}.apk"
          sha256sum "FireClear-v${NEW_VERSION}.apk" | tee SHA256SUMS.txt

      - name: "Publish GitHub Release"
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.versions.outputs.new_tag }}
          NEW_VERSION: ${{ steps.versions.outputs.new_version }}
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          SIGNED_BUILD: ${{ steps.build.outputs.signed }}
        run: |
          if [ "${SIGNED_BUILD}" = "true" ]; then
            printf "Release generated from manual workflow_dispatch (%s bump).\nAPK is signed with the configured FireClear release keystore.\n" "${BUMP_TYPE}" > RELEASE_BODY.txt
          else
            printf "Release generated from manual workflow_dispatch (%s bump).\n[!] APK is debug-signed for testing (FIRECLEAR signing secrets not fully configured).\n" "${BUMP_TYPE}" > RELEASE_BODY.txt
          fi

          gh release create "${NEW_TAG}" \
            "FireClear-v${NEW_VERSION}.apk" \
            SHA256SUMS.txt \
            --title "${NEW_TAG}" \
            --notes-file RELEASE_BODY.txt \
            --generate-notes
