name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static security audit
        run: bash scripts/audit.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android lint
        run: gradle --no-daemon lintDebug
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify permissions of the built APK
        run: bash scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Checksum
        run: |
          cd app/build/outputs/apk/debug
          cp app-debug.apk FireClear-debug.apk
          sha256sum FireClear-debug.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: FireClear-debug-apk
          path: |
            app/build/outputs/apk/debug/FireClear-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
